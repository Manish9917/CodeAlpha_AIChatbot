server.port=${PORT:8080}
spring.application.name=chatbot

# TiDB Cloud Database Configuration
spring.datasource.url=jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/chatbot_db?sslMode=VERIFY_IDENTITY
spring.datasource.username=1dUoJrqYWrK1jmZ.root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update

# Groq AI Configuration
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.key=${GROQ_API_KEY}
groq.api.model=openai/gpt-oss-20b

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

